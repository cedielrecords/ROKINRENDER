
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROKINRENDER</title>

<style>

body{
background:black;
font-family:Arial, Helvetica, sans-serif;
margin:0;
padding:0;
text-align:center;
color:white;
}

/* TITULO NEON */

h1{
margin-top:60px;
font-size:60px;
color:#ff2bd6;
text-shadow:
0 0 5px #ff2bd6,
0 0 10px #ff2bd6,
0 0 20px #ff2bd6,
0 0 40px #ff2bd6;
letter-spacing:4px;
}

/* CONTENEDOR */

.container{
margin-top:80px;
display:flex;
flex-direction:column;
align-items:center;
gap:35px;
}

/* CAJONES */

.box{
background:#ff2bd6;
color:black;
padding:22px 40px;
width:300px;
border-radius:12px;
font-weight:bold;
font-size:18px;
transition:0.25s;
}

.box:hover{
transform:scale(1.05);
box-shadow:0 0 25px #ff2bd6;
}

</style>
</head>

<body>

<h1>ROKINRENDER</h1>

<div class="container">

<div class="box">INFO INMOBILIARIA</div>

<div class="box">MARKETPLACE GREMIAL</div>

<div class="box">TEXTURAS & DOWNLOADS</div>

<div class="box">EDUCACIÓN</div>

<div class="box">RENDERS PROFESIONALES</div>

</div>

</body>
</html>
